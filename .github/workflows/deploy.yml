name: Deploy to Beget

# TZ 12.3. Manual only: pick a branch (default main). Nothing here runs on push.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch (or tag) to deploy'
        required: false
        default: main
        type: string

# Never run two deploys at once and never cancel one that is already running (NF-22).
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  PHP_EXTENSIONS: mbstring, intl, gd, zip, bcmath, pdo_sqlite, pdo_mysql, fileinfo
  BEGET_HOST: ${{ secrets.BEGET_HOST }}
  BEGET_USER: ${{ secrets.BEGET_USER }}
  BEGET_PATH: ${{ secrets.BEGET_PATH }}
  # Falls back to the default Beget PHP 8.3 CLI when the secret is empty.
  BEGET_PHP: ${{ secrets.BEGET_PHP || '/usr/local/php/cgi/8.3/bin/php' }}

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets
        env:
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          missing=""
          for name in BEGET_HOST BEGET_USER BEGET_PATH BEGET_SSH_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты GitHub:$missing. См. docs/DEPLOY_BEGET.md, раздел про секреты."
            exit 1
          fi
          # Secrets are masked by GitHub already; mask derived values explicitly as well.
          echo "::add-mask::$BEGET_HOST"
          echo "::add-mask::$BEGET_USER"
          echo "::add-mask::$BEGET_PATH"
          case "$BEGET_PATH" in
            /*) ;;
            *) echo "::error::BEGET_PATH должен быть абсолютным путём, например /home/X/LOGIN/shop."; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # post-autoload-dump runs `filament:upgrade`, which publishes the Filament assets into
      # public/{css,js,fonts}/filament. They are gitignored, so they exist only in this build (D-022).
      - name: Install PHP dependencies (production)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Verify the build
        run: |
          fail=0
          for path in vendor/autoload.php public/build/manifest.json public/js/filament public/css/filament; do
            if [ ! -e "$path" ]; then
              echo "::error::В сборке нет $path — выкладывать нечего."
              fail=1
            fi
          done
          exit "$fail"

      - name: Prepare SSH
        env:
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BEGET_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$BEGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan не получил ключ хоста. Проверьте секрет BEGET_HOST."
            exit 1
          fi
          cat > ~/.ssh/config <<SSHCONF
          Host beget
            HostName $BEGET_HOST
            User $BEGET_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 6
          SSHCONF
          chmod 600 ~/.ssh/config

      - name: Check connection and server state
        id: server
        run: |
          if ! ssh beget 'echo connected' > /dev/null; then
            echo "::error::Не удалось подключиться по SSH. Проверьте BEGET_HOST, BEGET_USER и что публичный ключ добавлен в ~/.ssh/authorized_keys на хостинге."
            exit 1
          fi
          if ssh beget "test -f '$BEGET_PATH/artisan'"; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
            echo "First deployment: the application is not installed yet."
          fi
          if ! ssh beget "test -f '$BEGET_PATH/.env'"; then
            echo "::error::На сервере нет $BEGET_PATH/.env. Создайте его по .env.example (см. docs/DEPLOY_BEGET.md) и запустите деплой снова."
            exit 1
          fi

      - name: Maintenance mode on
        if: steps.server.outputs.installed == 'true'
        run: |
          # From this point a failure must bring the site back (see the last step).
          echo "APP_DOWN=1" >> "$GITHUB_ENV"
          ssh beget "cd '$BEGET_PATH' && '$BEGET_PHP' artisan down --retry=30"

      - name: Upload files
        run: |
          # One exclude list for both transports (rsync syntax; the tar copy is derived from it).
          # Server-side state (.env, storage, symlinks, generated sitemap and caches) is never touched.
          cat > "$RUNNER_TEMP/excludes.rsync" <<'EXCLUDES'
          /.env
          /.env.backup
          /.env.production
          /storage/
          /public_html
          /public/storage
          /public/hot
          /public/sitemap*.xml
          /bootstrap/cache/*.php
          /.git/
          /.github/
          /.claude/
          /node_modules/
          /tests/
          /junit.xml
          /.phpunit.cache/
          EXCLUDES

          ssh beget "mkdir -p '$BEGET_PATH'"

          if ssh beget 'command -v rsync' > /dev/null 2>&1; then
            echo "Uploading with rsync"
            rsync -az --delete --exclude-from="$RUNNER_TEMP/excludes.rsync" -e ssh ./ "beget:$BEGET_PATH/"
          else
            echo "::warning::На сервере нет rsync: файлы загружаются архивом tar.gz. Удалённые из репозитория файлы на сервере не удаляются."
            sed -e 's#^/#./#' -e 's#/$##' "$RUNNER_TEMP/excludes.rsync" > "$RUNNER_TEMP/excludes.tar"
            tar -czf "$RUNNER_TEMP/release.tar.gz" --exclude-from="$RUNNER_TEMP/excludes.tar" .
            scp -q "$RUNNER_TEMP/release.tar.gz" "beget:$BEGET_PATH/.deploy-release.tar.gz"
            ssh beget "cd '$BEGET_PATH' && tar -xzf .deploy-release.tar.gz && rm -f .deploy-release.tar.gz"
          fi

      - name: Prepare and switch release on the server
        run: |
          cat > "$RUNNER_TEMP/remote.sh" <<'REMOTE'
          set -euo pipefail
          APP_DIR="$1"
          PHP="$2"
          cd "$APP_DIR"

          # 1. public_html must be a symlink to public (TZ 12.1).
          if [ -L public_html ]; then
            if [ "$(readlink public_html)" != "public" ]; then
              rm public_html
              ln -s public public_html
            fi
          elif [ -e public_html ]; then
            backup="public_html.bak-$(date +%Y%m%d%H%M%S)"
            mv public_html "$backup"
            ln -s public public_html
            echo "public_html was a regular folder, renamed to $backup"
          else
            ln -s public public_html
          fi

          # 2. Writable structure (storage/ is never shipped). The private disk root is storage/app/private.
          mkdir -p storage/app/public storage/app/private \
            storage/framework/cache/data storage/framework/sessions storage/framework/views storage/framework/testing \
            storage/logs bootstrap/cache
          chmod -R ug+rwX storage bootstrap/cache 2>/dev/null || true

          # 3. Generated caches may reference packages that no longer exist: start from a clean slate.
          rm -f bootstrap/cache/*.php
          "$PHP" artisan package:discover --ansi

          # 4. public/storage link: create it, or repair a dangling one.
          if [ -L public/storage ] && [ ! -e public/storage ]; then
            rm public/storage
          fi
          if [ -e public/storage ] || [ -L public/storage ]; then
            echo "public/storage already exists"
          else
            "$PHP" artisan storage:link
          fi

          # 5. Database, caches, queue.
          "$PHP" artisan migrate --force
          "$PHP" artisan optimize:clear
          "$PHP" artisan view:clear
          "$PHP" artisan optimize
          commands="$("$PHP" artisan list --raw)"
          if grep -q '^filament:optimize ' <<<"$commands"; then
            "$PHP" artisan filament:optimize
          else
            echo "filament:optimize is not available, skipped"
          fi
          "$PHP" artisan queue:restart
          "$PHP" artisan up
          echo "Release is live"
          REMOTE
          ssh beget bash -s -- "'$BEGET_PATH'" "'$BEGET_PHP'" < "$RUNNER_TEMP/remote.sh"
          echo "APP_DOWN=0" >> "$GITHUB_ENV"

      - name: Health check (/up)
        run: |
          raw="$(ssh beget "grep -E '^APP_URL=' '$BEGET_PATH/.env' | head -n 1" || true)"
          app_url="$(printf '%s' "${raw#APP_URL=}" | tr -d '\r"'"'"'' | sed -e 's/[[:space:]]*#.*$//' -e 's/[[:space:]]*$//' -e 's#/*$##')"
          if [ -z "$app_url" ]; then
            echo "::error::Проверка /up не прошла: в $BEGET_PATH/.env не найден APP_URL."
            ssh beget "cd '$BEGET_PATH' && '$BEGET_PHP' artisan up" || true
            exit 1
          fi

          code=000
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -L --max-redirs 3 --max-time 20 -o /dev/null -w '%{http_code}' "$app_url/up" || true)"
            if [ "$code" = "200" ]; then
              echo "Health check passed (HTTP 200)"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code"
            sleep 5
          done

          ssh beget "cd '$BEGET_PATH' && '$BEGET_PHP' artisan up" || true
          echo "::error::Проверка /up не прошла: последний ответ HTTP $code. Сайт выведен из режима обслуживания; смотрите storage/logs на сервере и docs/DEPLOY_BEGET.md (раздел про ошибки деплоя)."
          exit 1

      - name: Bring the site back after a failure
        if: failure() && env.APP_DOWN == '1'
        run: |
          # The release may be half-installed, but a maintenance page forever is worse (NF-22).
          if [ -f ~/.ssh/config ]; then
            ssh beget "cd '$BEGET_PATH' && test -f artisan && '$BEGET_PHP' artisan up" \
              || echo "::warning::Не удалось выполнить php artisan up. Выполните его вручную на сервере."
          fi
          echo "::error::Деплой не завершён, сайт выведен из режима обслуживания. Проверьте журнал шагов выше."
